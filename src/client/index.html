<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Superagent</title>
<script>
  // Every URL here is relative to the page, so behind a gateway the page must end in a slash: without it
  // /proxy/3082 would resolve ./panel.js and the API to /proxy/ instead of /proxy/3082/.
  if (!/(\/|\.html)$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash)
</script>
<link rel="stylesheet" href="./panel.css">
<script type="module" src="./panel.js"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
